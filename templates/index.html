<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>B站热门视频趋势分析</title>
    <!-- ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <!-- ECharts WordCloud -->
    <script src="https://cdn.jsdelivr.net/npm/echarts-wordcloud@2.1.0/dist/echarts-wordcloud.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .header {
            text-align: center;
            color: white;
            padding: 30px 0;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .control-panel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .control-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-group label {
            font-size: 0.85em;
            color: #666;
            font-weight: 500;
        }

        select, input {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .stats-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            font-size: 2em;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: #666;
            font-size: 0.9em;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 1400px) {
            .container {
                max-width: 100%;
            }
        }

        @media (max-width: 1200px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }

            .chart-container {
                height: 350px;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .chart-container {
                height: 300px;
            }

            .chart-container.large {
                height: 350px;
            }
        }

        .chart-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .chart-card.full-width {
            grid-column: 1 / -1;
        }

        .chart-card h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 1.1em;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .chart-container {
            height: 320px;
            width: 100%;
        }

        .chart-container.large {
            height: 400px;
            width: 100%;
        }

        .video-list {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .video-list h3 {
            margin-bottom: 20px;
            color: #333;
        }

        .video-table {
            width: 100%;
            border-collapse: collapse;
        }

        .video-table th,
        .video-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }

        .video-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #555;
        }

        .video-table tr:hover {
            background: #f8f9fa;
        }

        .video-title {
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .video-title a {
            color: #333;
            text-decoration: none;
        }

        .video-title a:hover {
            color: #667eea;
        }

        .video-thumb {
            width: 80px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
        }

        .keywords-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .keyword-tag {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
        }

        .keyword-weight {
            opacity: 0.8;
            font-size: 0.8em;
            margin-left: 5px;
        }

        .fetch-info {
            font-size: 0.85em;
            color: #666;
            margin-top: 10px;
        }

        #content {
            display: none;
        }

        .number-format {
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>B站热门视频趋势分析</h1>
            <p>Bilibili Hot Video Trend Analyzer</p>
        </div>

        <!-- 控制面板 -->
        <div class="control-panel">
            <div class="control-row">
                <div class="control-group">
                    <label>数据类型</label>
                    <select id="dataType">
                        <option value="popular">综合热门</option>
                        <option value="ranking">分区排行榜</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>页数 (每页20个)</label>
                    <input type="number" id="pages" value="5" min="1" max="20">
                </div>

                <div class="control-group" id="partitionGroup" style="display:none;">
                    <label>分区</label>
                    <select id="partition">
                        {% for p in partitions %}
                        <option value="{{ p }}">{{ p }}</option>
                        {% endfor %}
                    </select>
                </div>

                <button class="btn btn-primary" id="fetchBtn" onclick="fetchData()">
                    获取数据
                </button>

                <button class="btn btn-secondary" id="exportBtn" onclick="exportData()" disabled>
                    导出CSV
                </button>
            </div>
            <div class="fetch-info" id="fetchInfo"></div>
        </div>

        <div id="message"></div>

        <!-- 加载状态 -->
        <div id="loading" style="display:none;">
            <div class="chart-card">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>正在获取数据并分析，请稍候...</p>
                </div>
            </div>
        </div>

        <!-- 分析内容 -->
        <div id="content">
            <!-- 统计概览 -->
            <div class="stats-overview">
                <div class="stat-card">
                    <h3 id="totalVideos">0</h3>
                    <p>视频总数</p>
                </div>
                <div class="stat-card">
                    <h3 id="avgView">0</h3>
                    <p>平均播放量</p>
                </div>
                <div class="stat-card">
                    <h3 id="avgLike">0</h3>
                    <p>平均点赞数</p>
                </div>
                <div class="stat-card">
                    <h3 id="engagementRate">0%</h3>
                    <p>平均互动率</p>
                </div>
            </div>

            <!-- 图表 -->
            <div class="charts-grid">
                <!-- 词云图 -->
                <div class="chart-card">
                    <h3>热门关键词词云</h3>
                    <div class="chart-container" id="wordcloudChart"></div>
                </div>

                <!-- 分区分布 -->
                <div class="chart-card">
                    <h3>视频分区分布</h3>
                    <div class="chart-container" id="partitionChart"></div>
                </div>

                <!-- 播放量分布 -->
                <div class="chart-card">
                    <h3>播放量分布</h3>
                    <div class="chart-container" id="viewDistChart"></div>
                </div>

                <!-- 互动率分析 -->
                <div class="chart-card">
                    <h3>用户互动率分析</h3>
                    <div class="chart-container" id="interactionChart"></div>
                </div>

                <!-- 播放量TOP20 -->
                <div class="chart-card full-width">
                    <h3>播放量 TOP 20</h3>
                    <div class="chart-container large" id="topVideosChart"></div>
                </div>

                <!-- 热门UP主 -->
                <div class="chart-card">
                    <h3>热门UP主 (按总播放量)</h3>
                    <div class="chart-container" id="topUpsChart"></div>
                </div>

                <!-- TF-IDF关键词 -->
                <div class="chart-card">
                    <h3>TF-IDF热点关键词</h3>
                    <div id="keywordsList" class="keywords-list"></div>
                </div>
            </div>

            <!-- 视频列表 -->
            <div class="video-list">
                <h3>热门视频列表</h3>
                <table class="video-table">
                    <thead>
                        <tr>
                            <th>封面</th>
                            <th>标题</th>
                            <th>UP主</th>
                            <th>播放量</th>
                            <th>点赞</th>
                            <th>评论</th>
                        </tr>
                    </thead>
                    <tbody id="videoTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 数据类型切换
        document.getElementById('dataType').addEventListener('change', function() {
            document.getElementById('partitionGroup').style.display =
                this.value === 'ranking' ? 'block' : 'none';
        });

        // 格式化数字
        function formatNumber(num) {
            if (num >= 100000000) {
                return (num / 100000000).toFixed(1) + '亿';
            } else if (num >= 10000) {
                return (num / 10000).toFixed(1) + '万';
            }
            return num.toLocaleString();
        }

        // 获取数据
        async function fetchData() {
            const btn = document.getElementById('fetchBtn');
            const loading = document.getElementById('loading');
            const content = document.getElementById('content');
            const message = document.getElementById('message');

            btn.disabled = true;
            btn.textContent = '获取中...';
            loading.style.display = 'block';
            content.style.display = 'none';
            message.innerHTML = '';

            try {
                const response = await fetch('/api/fetch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: document.getElementById('dataType').value,
                        pages: document.getElementById('pages').value,
                        partition: document.getElementById('partition').value
                    })
                });

                const result = await response.json();

                if (result.success) {
                    message.innerHTML = `<div class="message success">${result.message}</div>`;
                    await loadAnalysis();
                    document.getElementById('exportBtn').disabled = false;
                } else {
                    message.innerHTML = `<div class="message error">${result.message}</div>`;
                    loading.style.display = 'none';
                }
            } catch (error) {
                message.innerHTML = `<div class="message error">请求失败: ${error.message}</div>`;
                loading.style.display = 'none';
            }

            btn.disabled = false;
            btn.textContent = '获取数据';
        }

        // 加载分析结果
        async function loadAnalysis() {
            try {
                const response = await fetch('/api/analysis');
                const data = await response.json();

                if (data.success) {
                    renderDashboard(data);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('content').style.display = 'block';
                    document.getElementById('fetchInfo').textContent =
                        `数据获取时间: ${data.fetch_time} | 类型: ${data.fetch_type}`;
                }
            } catch (error) {
                console.error('加载分析失败:', error);
            }
        }

        // 渲染仪表盘
        function renderDashboard(data) {
            const stats = data.stats;

            // 更新统计卡片
            document.getElementById('totalVideos').textContent = stats.total;
            document.getElementById('avgView').textContent = formatNumber(stats.view_stats.mean);
            document.getElementById('avgLike').textContent = formatNumber(stats.like_stats.mean);
            document.getElementById('engagementRate').textContent = stats.engagement_rate + '%';

            // 渲染图表
            renderWordcloud(data.wordcloud);
            renderPartitionChart(stats.partition_dist);
            renderViewDistChart(data.videos);
            renderInteractionChart(stats.interaction_rates);
            renderTopVideosChart(stats.top_videos);
            renderTopUpsChart(stats.top_ups);
            renderKeywords(data.keywords);
            renderVideoTable(data.videos);
        }

        // 词云图
        function renderWordcloud(wordData) {
            const chart = echarts.init(document.getElementById('wordcloudChart'));
            chart.setOption({
                series: [{
                    type: 'wordCloud',
                    shape: 'circle',
                    sizeRange: [14, 60],
                    rotationRange: [-45, 45],
                    gridSize: 8,
                    drawOutOfBound: false,
                    textStyle: {
                        fontFamily: 'sans-serif',
                        fontWeight: 'bold',
                        color: function() {
                            return 'rgb(' + [
                                Math.round(Math.random() * 160 + 60),
                                Math.round(Math.random() * 160 + 60),
                                Math.round(Math.random() * 160 + 60)
                            ].join(',') + ')';
                        }
                    },
                    data: wordData
                }]
            });
        }

        // 分区分布饼图
        function renderPartitionChart(partitionData) {
            const chart = echarts.init(document.getElementById('partitionChart'));
            const data = Object.entries(partitionData).map(([name, value]) => ({ name, value }));

            chart.setOption({
                tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
                series: [{
                    type: 'pie',
                    radius: ['40%', '70%'],
                    avoidLabelOverlap: false,
                    itemStyle: { borderRadius: 10, borderColor: '#fff', borderWidth: 2 },
                    label: { show: true, formatter: '{b}' },
                    data: data
                }]
            });
        }

        // 播放量分布直方图
        function renderViewDistChart(videos) {
            const chart = echarts.init(document.getElementById('viewDistChart'));
            const views = videos.map(v => v.view / 10000);

            // 计算直方图
            const bins = 20;
            const max = Math.max(...views);
            const min = Math.min(...views);
            const binWidth = (max - min) / bins;
            const histogram = new Array(bins).fill(0);
            const labels = [];

            for (let i = 0; i < bins; i++) {
                labels.push(Math.round(min + i * binWidth));
            }

            views.forEach(v => {
                const idx = Math.min(Math.floor((v - min) / binWidth), bins - 1);
                histogram[idx]++;
            });

            chart.setOption({
                tooltip: { trigger: 'axis' },
                grid: {
                    left: '10%',
                    right: '10%',
                    top: '10%',
                    bottom: '15%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: labels,
                    name: '播放量(万)',
                    axisLabel: {
                        rotate: 45,
                        fontSize: 10
                    }
                },
                yAxis: {
                    type: 'value',
                    name: '视频数'
                },
                series: [{
                    type: 'bar',
                    data: histogram,
                    itemStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: '#667eea' },
                            { offset: 1, color: '#764ba2' }
                        ])
                    }
                }]
            });
        }

        // 互动率分析
        function renderInteractionChart(rates) {
            const chart = echarts.init(document.getElementById('interactionChart'));

            chart.setOption({
                tooltip: { trigger: 'axis', formatter: '{b}: {c}%' },
                xAxis: {
                    type: 'category',
                    data: ['点赞率', '投币率', '收藏率', '分享率']
                },
                yAxis: { type: 'value', name: '百分比 (%)' },
                series: [{
                    type: 'bar',
                    data: [
                        { value: rates.like_rate, itemStyle: { color: '#FF6B6B' } },
                        { value: rates.coin_rate, itemStyle: { color: '#4ECDC4' } },
                        { value: rates.favorite_rate, itemStyle: { color: '#45B7D1' } },
                        { value: rates.share_rate, itemStyle: { color: '#96CEB4' } }
                    ],
                    label: { show: true, position: 'top', formatter: '{c}%' }
                }]
            });
        }

        // 播放量TOP20
        function renderTopVideosChart(topVideos) {
            const chart = echarts.init(document.getElementById('topVideosChart'));

            const titles = topVideos.map(v =>
                v.title.length > 15 ? v.title.substring(0, 15) + '...' : v.title
            ).reverse();
            const views = topVideos.map(v => v.view).reverse();

            chart.setOption({
                tooltip: {
                    trigger: 'axis',
                    formatter: function(params) {
                        return params[0].name + ': ' + formatNumber(params[0].value);
                    }
                },
                grid: {
                    left: '5%',
                    right: '15%',
                    top: '5%',
                    bottom: '5%',
                    containLabel: true
                },
                xAxis: {
                    type: 'value',
                    name: '播放量',
                    axisLabel: {
                        formatter: function(value) {
                            return formatNumber(value);
                        }
                    }
                },
                yAxis: {
                    type: 'category',
                    data: titles,
                    axisLabel: { fontSize: 9 }
                },
                series: [{
                    type: 'bar',
                    data: views,
                    itemStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                            { offset: 0, color: '#667eea' },
                            { offset: 1, color: '#764ba2' }
                        ])
                    },
                    label: {
                        show: true,
                        position: 'right',
                        fontSize: 10,
                        formatter: function(params) {
                            return formatNumber(params.value);
                        }
                    }
                }]
            });
        }

        // 热门UP主
        function renderTopUpsChart(topUps) {
            const chart = echarts.init(document.getElementById('topUpsChart'));

            const names = Object.keys(topUps).reverse();
            const views = Object.values(topUps).reverse();

            chart.setOption({
                tooltip: {
                    trigger: 'axis',
                    formatter: function(params) {
                        return params[0].name + ': ' + formatNumber(params[0].value);
                    }
                },
                grid: {
                    left: '5%',
                    right: '15%',
                    top: '5%',
                    bottom: '5%',
                    containLabel: true
                },
                xAxis: {
                    type: 'value',
                    name: '总播放量',
                    axisLabel: {
                        formatter: function(value) {
                            return formatNumber(value);
                        }
                    }
                },
                yAxis: {
                    type: 'category',
                    data: names,
                    axisLabel: { fontSize: 10 }
                },
                series: [{
                    type: 'bar',
                    data: views,
                    itemStyle: { color: '#764ba2' },
                    label: {
                        show: true,
                        position: 'right',
                        fontSize: 10,
                        formatter: function(params) {
                            return formatNumber(params.value);
                        }
                    }
                }]
            });
        }

        // 关键词列表
        function renderKeywords(keywords) {
            const container = document.getElementById('keywordsList');
            container.innerHTML = keywords.map(k =>
                `<span class="keyword-tag">${k.word}<span class="keyword-weight">${k.weight}</span></span>`
            ).join('');
        }

        // 视频表格
        function renderVideoTable(videos) {
            const tbody = document.getElementById('videoTableBody');
            tbody.innerHTML = videos.slice(0, 50).map(v => `
                <tr>
                    <td><img class="video-thumb" src="${v.pic}" alt=""></td>
                    <td class="video-title">
                        <a href="${v.url}" target="_blank" title="${v.title}">${v.title}</a>
                    </td>
                    <td>${v.up_name}</td>
                    <td class="number-format">${formatNumber(v.view)}</td>
                    <td class="number-format">${formatNumber(v.like)}</td>
                    <td class="number-format">${formatNumber(v.reply)}</td>
                </tr>
            `).join('');
        }

        // 导出数据
        async function exportData() {
            try {
                const response = await fetch('/api/export');
                const result = await response.json();

                const message = document.getElementById('message');
                if (result.success) {
                    message.innerHTML = `<div class="message success">${result.message}</div>`;
                } else {
                    message.innerHTML = `<div class="message error">${result.message}</div>`;
                }
            } catch (error) {
                console.error('导出失败:', error);
            }
        }

        // 页面加载时尝试恢复缓存数据
        window.addEventListener('DOMContentLoaded', async function() {
            try {
                const response = await fetch('/api/analysis');
                const data = await response.json();

                if (data.success) {
                    // 有缓存数据，自动加载
                    renderDashboard(data);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('content').style.display = 'block';
                    document.getElementById('fetchInfo').textContent =
                        `数据获取时间: ${data.fetch_time} | 类型: ${data.fetch_type} (已从缓存加载)`;
                    console.log('已从缓存加载数据');
                }
            } catch (error) {
                console.log('无缓存数据或加载失败，请点击"获取数据"按钮');
            }
        });

        // 窗口大小改变时重绘图表
        window.addEventListener('resize', function() {
            const charts = ['wordcloudChart', 'partitionChart', 'viewDistChart',
                          'interactionChart', 'topVideosChart', 'topUpsChart'];
            charts.forEach(id => {
                const chart = echarts.getInstanceByDom(document.getElementById(id));
                if (chart) chart.resize();
            });
        });
    </script>
</body>
</html>
